schema_version: 1

context:
  version: "3.25"
  build_number: 7

recipe:
  name: bullet
  version: ${{ version }}

source:
  url: https://github.com/bulletphysics/bullet3/archive/${{ version }}.tar.gz
  sha256: c45afb6399e3f68036ddb641c6bf6f552bf332d5ab6be62f7e6c54eda05ceb77
  patches:
    - devendorzlib.patch
    - double-precision-postfix.patch
    - if: linux
      then: add_rt.patch
    - if: ppc64le
      then:
        # On ppc64le compilation of Bullet3OpenCL fails (https://github.com/conda-forge/bullet-feedstock/issues/24)
        - disable-bullet3opencl.patch
        # The setup.py hardcodes a custom logic to decide the number of compilation threads,
        # let's override it for memory limited architectures (as of early 2021, travis with ppc64le)
        - setup-py-single-thread-compilation.patch

build:
  number: ${{ build_number }}

outputs:
  - staging:
      name: bullet-cpp-build
    build:
      script:
        - if: unix
          then: build_cpp.sh
          else: bld_cpp.bat
    requirements:
      build:
        - cmake <4
        - ninja
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - ${{ compiler("cxx") }}
      host:
        # No python here on purpose: the C++ build is independent of the Python version,
        # the Python bindings are built from source in the pybullet output
        - if: linux
          then: libgl-devel
        - if: unix
          then:
            - xorg-libx11
            - xorg-libxext
      ignore_run_exports:
        # OpenGL and X11 are only used by the example browser libraries shipped in bullet-cpp
        from_package:
          - if: linux
            then: libgl-devel
          - if: unix
            then:
              - xorg-libx11
              - xorg-libxext

  - package:
      name: libbullet
    inherit: bullet-cpp-build
    build:
      files:
        include:
          - "**"
        exclude:
          - if: unix
            then:
              - bin/BulletExampleBrowser
              - lib/libOpenGLWindow.*
              - lib/libgwen.*
              - lib/libBulletExampleBrowserLib.*
              - lib/libBulletRoboticsGUI.*
              - lib/pkgconfig/bullet_robotics_gui.pc
              - opt/bullet/**
            else:
              - Library/lib/OpenGLWindow.lib
              - Library/lib/gwen.lib
              - Library/lib/BulletExampleBrowserLib.lib
              - Library/lib/BulletRoboticsGUI.lib
    requirements:
      run_exports:
        - ${{ pin_subpackage('libbullet', upper_bound='x.x') }}
      run_constraints:
        # bullet-cpp builds from before the libbullet split ship the same files
        - bullet-cpp ==${{ version }} *_${{ build_number }}
    tests:
      - package_contents:
          include:
            - bullet/BulletSoftBody/btSoftBody.h
          files:
            exists:
              - if: unix
                then:
                  - lib/pkgconfig/bullet.pc
                  - lib/pkgconfig/bullet_robotics.pc
                  - lib/cmake/bullet/BulletConfig.cmake
                else:
                  - Library/lib/cmake/bullet/BulletConfig.cmake
                  - Library/lib/BussIK.lib
                  - Library/lib/BulletCollision.lib
            not_exists:
              - if: unix
                then:
                  - bin/BulletExampleBrowser
                  - lib/libOpenGLWindow.*
                  - lib/libgwen.*
                  - lib/libBulletExampleBrowserLib.*
                  - lib/libBulletRoboticsGUI.*
                  - opt/bullet/**
                else:
                  - Library/lib/OpenGLWindow.lib
                  - Library/lib/gwen.lib
          lib:
            - if: unix
              then:
                - BussIK
                - Bullet3Dynamics
                - BulletDynamics
                - BulletRobotics

  - package:
      name: bullet-cpp
    inherit: bullet-cpp-build
    build:
      files:
        - if: unix
          then:
            - bin/BulletExampleBrowser
            - lib/libOpenGLWindow.*
            - lib/libgwen.*
            - lib/libBulletExampleBrowserLib.*
            - lib/libBulletRoboticsGUI.*
            - lib/pkgconfig/bullet_robotics_gui.pc
            - opt/bullet/**
          else:
            - Library/lib/OpenGLWindow.lib
            - Library/lib/gwen.lib
            - Library/lib/BulletExampleBrowserLib.lib
            - Library/lib/BulletRoboticsGUI.lib
    requirements:
      host:
        - ${{ pin_subpackage("libbullet", exact=True) }}
        - if: linux
          then: libgl-devel
        - if: unix
          then:
            - xorg-libx11
            - xorg-libxext
      run:
        - ${{ pin_subpackage("libbullet", exact=True) }}
        - if: unix
          then:
            - xorg-libx11
            - xorg-libxext
      run_exports:
        # The libraries that downstream packages link against are in libbullet
        - ${{ pin_subpackage('libbullet', upper_bound='x.x') }}
    tests:
      - package_contents:
          files:
            - if: unix
              then:
                - lib/pkgconfig/bullet_robotics_gui.pc
              else:
                - Library/lib/OpenGLWindow.lib
                - Library/lib/BulletExampleBrowserLib.lib
            - if: linux
              then: bin/BulletExampleBrowser
          lib:
            - if: unix
              then:
                - BulletExampleBrowserLib
                - BulletRoboticsGUI
                - OpenGLWindow
                - gwen

  - package:
      name: pybullet
    build:
      script:
        - if: unix
          then: build_py.sh
          else: bld_py.bat
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - numpy
        - cmake <4
        - ninja
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - ${{ compiler("cxx") }}
      host:
        - ${{ pin_subpackage("bullet-cpp", exact=True) }}
        - python
        - pip
        - setuptools
        - wheel
        - numpy
        - zlib
      run:
        - ${{ pin_subpackage("bullet-cpp", exact=True) }}
        - python
    tests:
      - python:
          imports:
            - pybullet
          pip_check: false

  - package:
      name: bullet
    requirements:
      host:
        # Not a real dependency, it ensures that there is one variant of this output per Python version
        - python
        - numpy
      run:
        - ${{ pin_subpackage("bullet-cpp", exact=True) }}
        - ${{ pin_subpackage("pybullet", exact=True) }}
        - python
    tests:
      - python:
          imports:
            - pybullet
          pip_check: false

about:
  homepage: http://bulletphysics.org
  license: Zlib
  license_file: LICENSE.txt
  summary: |
    Bullet Physics SDK real-time collision detection and multi-physics
    simulation for VR, games, visual effects, robotics, machine learning
    etc.

extra:
  recipe-maintainers:
    - traversaro
    - wolfv
